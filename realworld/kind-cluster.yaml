# Dedicated cluster for the IncidentMind fault-injection pilot (V0).
# Single node; the existing `selfheal` cluster is left untouched.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incidentmind-fi
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1
    extraPortMappings:
      - containerPort: 30080   # frontend NodePort, for host-side sanity checks
        hostPort: 30080
        protocol: TCP
